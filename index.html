<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Magify — Grimorio de Magic: The Gathering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Fondo pixel art global -->
<div class="pixel-bg" id="pixelBg"></div>

<div class="app">

  <!-- ============ VISTA: BUSCADOR ============ -->
  <section class="view" id="view-buscador" data-view="buscador">
    <header class="app-header">
      <img src="assets/icons/magify_logo.png" alt="Magify" class="app-logo">
      <p class="brand">MAGIFY</p>
      <h1 class="title-gold">Buscador de Cartas</h1>
    </header>

    <div class="search-wrap">
      <form class="search-bar" id="searchForm" autocomplete="off">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Nombre de la carta..."
          enterkeyhint="search"
          autocomplete="off"
        >
        <button type="submit" class="search-btn" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.2" y2="16.2"/>
          </svg>
        </button>
      </form>
      <ul class="autocomplete-list hidden" id="autocompleteList"></ul>
    </div>

    <div class="search-status" id="searchStatus"></div>

    <div class="card-grid" id="resultsGrid"></div>

    <!-- Móvil: sentinel para scroll infinito + botón de respaldo -->
    <div class="results-more hidden" id="resultsMore">
      <div class="results-sentinel" id="resultsSentinel" aria-hidden="true"></div>
      <button class="action-btn" id="loadMoreBtn" type="button" aria-label="Ver más resultados">Ver más</button>
    </div>

    <!-- Desktop: paginación de 8 en 8 -->
    <nav class="pager hidden" id="resultsPager" aria-label="Paginación de resultados">
      <button class="action-btn" id="prevPageBtn" type="button" aria-label="Página anterior">Anterior</button>
      <span class="pager-info" id="pagerInfo" aria-live="polite"></span>
      <button class="action-btn" id="nextPageBtn" type="button" aria-label="Página siguiente">Siguiente</button>
    </nav>
  </section>

  <!-- ============ VISTA: BARAJAR ============ -->
  <section class="view hidden" id="view-barajar" data-view="barajar">
    <header class="app-header app-header-compact">
      <img src="assets/icons/magify_logo.png" alt="Magify" class="app-logo">
      <div class="header-text">
        <p class="brand">MAGIFY</p>
        <h1 class="title-gold">Barajar</h1>
      </div>
    </header>

    <div class="barajar-stage" id="barajarStage">
      <div class="barajar-card-col">
        <div class="random-card-wrap" id="randomCardWrap" role="button" tabindex="0" aria-label="Barajar carta aleatoria">
          <p class="hint-text">Tocá la carta para revelar una al azar</p>
        </div>
        <div class="barajar-actions">
          <button class="action-btn" id="shuffleBtn" type="button" aria-label="Barajar carta aleatoria">Barajar</button>
          <button class="ver-mas-btn hidden" id="verMasBtn" type="button" aria-label="Ver más datos de la carta">ver más ↗</button>
        </div>
      </div>
      <aside class="barajar-info hidden" id="randomInfo" aria-live="polite" aria-label="Datos de la carta"></aside>
    </div>
  </section>

  <!-- ============ DETALLE DE CARTA (overlay) ============ -->
  <section class="view detail-view hidden" id="view-detail" data-view="detail">
    <button class="close-btn" id="closeDetailBtn" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </svg>
    </button>

    <header class="app-header detail-app-header">
      <img src="assets/icons/magify_logo.png" alt="Magify" class="app-logo">
      <p class="brand">MAGIFY</p>
    </header>

    <div class="detail-scroll" id="detailScroll"></div>
  </section>

  <!-- ============ NAV INFERIOR ============ -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
    <button class="nav-btn active" data-target="buscador" aria-label="Buscar" aria-current="page">
      <img src="assets/icons/buscar_pixel_icon.png" alt="">
    </button>
    <button class="nav-btn" data-target="barajar" aria-label="Barajar">
      <img src="assets/icons/barajar_pixel_icon.png" alt="">
    </button>
  </nav>

</div>

<script src="js/scryfall.js"></script>
<script src="js/app.js"></script>
</body>
</html>
